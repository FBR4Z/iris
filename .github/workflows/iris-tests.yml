name: Testes da Íris

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Instalar dependências
        run: uv sync
      - name: Rodar testes
        run: uv run pytest -q -p no:warnings
