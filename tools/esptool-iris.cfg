# Configuração do esptool usada pelo tools/esp_idf_mcp.py (via ESPTOOL_CFGFILE).
#
# Placas cujo circuito de auto-gravação não leva o GPIO0 a nível baixo (ex.: DevKit
# montado numa placa de apoio) só entram em modo de gravação com o botão BOOT. Com mais
# tentativas, o flash_project do MCP fica ~2 minutos reiniciando a placa: basta segurar
# o BOOT por uns 3 segundos em algum momento, sem precisar acertar a hora.
[esptool]
connect_attempts = 80
